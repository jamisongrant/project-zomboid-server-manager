name: CI

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static regression checks
        shell: pwsh
        run: |
          ./tests/Run-Regression.ps1 -SkipLiveApi

